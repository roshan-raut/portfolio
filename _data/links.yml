# Curated resources shown on /links
- category: "AI Infrastructure"
  icon: "fa-microchip"
  links:
    - name: "vLLM"
      url: "https://docs.vllm.ai/"
      description: "High-throughput LLM inference engine (PagedAttention, continuous batching, prefix caching)."
    - name: "llm-d"
      url: "https://llm-d.ai/"
      description: "Kubernetes-native distributed inference on top of vLLM: KV-cache-aware routing and prefill/decode disaggregation."
    - name: "Gateway API Inference Extension"
      url: "https://gateway-api-inference-extension.sigs.k8s.io/"
      description: "The Kubernetes standard for model-aware load balancing of inference traffic."
    - name: "NVIDIA GPU Operator"
      url: "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/"
      description: "Drivers, container toolkit, DRA driver, DCGM and MIG management for Kubernetes GPU nodes."
    - name: "DRA Driver for NVIDIA GPUs"
      url: "https://dra-driver-nvidia-gpu.sigs.k8s.io/docs/"
      description: "Dynamic Resource Allocation for GPUs — the successor to the classic device plugin."
    - name: "Kueue"
      url: "https://kueue.sigs.k8s.io/"
      description: "Job queueing, quotas and fair sharing for batch/AI workloads on Kubernetes."

