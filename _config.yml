# Site settings
title: Roshan Raut
description: "Platform & AI Infrastructure engineer. Writing about GPUs, Kubernetes, LLM serving, MLOps and FinOps for AI."
url: "https://roshan-raut.github.io"
baseurl: "/portfolio"
lang: en

author:
  name: Roshan Raut
  username: roshan-raut
  avatar: /assets/images/Photo.jpg
  bio: Platform & AI Infrastructure Engineer

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  collections:
    - blogs

# Collections
# To publish a new post: add a Markdown file to _blogs/ with front matter
# (title, date, summary, tags, optional series/part/featured). Nothing else to update.
collections:
  blogs:
    output: true
    permalink: /blogs/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .github/

defaults:
  - scope:
      path: ""
      type: "blogs"
    values:
      layout: "post"
      author: "Roshan Raut"
