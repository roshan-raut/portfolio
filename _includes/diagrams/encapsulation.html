 width="80" height="34" rx="6" class="dg-box"/><text x="440" y="206" class="dg-label" text-anchor="middle">TLS</text><rect x="320" y="184" width="80" height="34" rx="6" class="dg-box"/><text x="360" y="206" class="dg-label" text-anchor="middle">TCP hdr</text><rect x="240" y="184" width="80" height="34" rx="6" class="dg-box-accent"/><text x="280" y="206" class="dg-label" text-anchor="middle">IP hdr</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.62;0.93;0.97;1"/><text x="10" y="256" class="dg-text">L2 Data link</text><rect x="480" y="234" width="160" height="34" rx="6" class="dg-box"/><text x="560" y="256" class="dg-label" text-anchor="middle">HTTP request</text><rect x="400" y="234" width="80" height="34" rx="6" class="dg-box"/><text x="440" y="256" class="dg-label" text-anchor="middle">TLS</text><rect x="320" y="234" width="80" height="34" rx="6" class="dg-box"/><text x="360" y="256" class="dg-label" text-anchor="middle">TCP hdr</text><rect x="240" y="234" width="80" height="34" rx="6" class="dg-box"/><text x="280" y="256" class="dg-label" text-anchor="middle">IP hdr</text><rect x="160" y="234" width="80" height="34" rx="6" class="dg-box-accent"/><text x="200" y="256" class="dg-label" text-anchor="middle">Eth hdr</text><rect x="640" y="234" width="50" height="34" rx="6" class="dg-box-accent"/><text x="665" y="256" class="dg-label" text-anchor="middle">FCS</text></g><text x="10" y="18" class="dg-sub">each layer wraps the one above with its own header ↓</text><text x="10" y="300" class="dg-sub">the receiver unwraps in reverse: Ethernet → IP → TCP → TLS → HTTP</text></svg>
