<svg viewBox="0 0 760 190" role="img" aria-label="A packet travelling from a laptop through home router, ISP and IXP to a CDN edge, and the response coming back" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pj-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrow"/></marker><marker id="pj-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-packet"/></marker><marker id="pj-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-packet-2"/></marker><marker id="pj-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-packet-3"/></marker></defs><line x1="134" y1="102.0" x2="160" y2="102.0" class="dg-line" marker-end="url(#pj-m)"/><line x1="284" y1="102.0" x2="310" y2="102.0" class="dg-line" marker-end="url(#pj-m)"/><line x1="434" y1="102.0" x2="460" y2="102.0" class="dg-line" marker-end="url(#pj-m)"/><line x1="584" y1="102.0" x2="610" y2="102.0" class="dg-line" marker-end="url(#pj-m)"/><rect x="10" y="70" width="124" height="64" rx="10" class="dg-box-accent"/><text x="72.0" y="98.0" class="dg-text" text-anchor="middle">Laptop</text><text x="72.0" y="116.0" class="dg-sub" text-anchor="middle">192.168.1.20</text><rect x="160" y="70" width="124" height="64" rx="10" class="dg-box"/><text x="222.0" y="98.0" class="dg-text" text-anchor="middle">Home router</text><text x="222.0" y="116.0" class="dg-sub" text-anchor="middle">NAT → public IP</text><rect x="310" y="70" width="124" height="64" rx="10" class="dg-box"/><text x="372.0" y="98.0" class="dg-text" text-anchor="middle">ISP</text><text x="372.0" y="116.0" class="dg-sub" text-anchor="middle">AS 1136</text><rect x="460" y="70" width="124" height="64" rx="10" class="dg-box"/><text x="522.0" y="98.0" class="dg-text" text-anchor="middle">IXP / transit</text><text x="522.0" y="116.0" class="dg-sub" text-anchor="middle">BGP picks path</text><rect x="610" y="70" width="124" height="64" rx="10" class="dg-box-accent"/><text x="672.0" y="98.0" class="dg-text" text-anchor="middle">CDN edge</text><text x="672.0" y="116.0" class="dg-sub" text-anchor="middle">anycast, ~5 ms</text><circle r="7" class="dg-packet" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M72.0,58.0 L222.0,58.0" keyPoints="0;0;1;1" keyTimes="0;0.03;0.1;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.03;0.034;0.1;0.104;1"/></circle><circle r="7" class="dg-packet" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M222.0,58.0 L372.0,58.0" keyPoints="0;0;1;1" keyTimes="0;0.13;0.2;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.13;0.134;0.2;0.204;1"/></circle><circle r="7" class="dg-packet" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M372.0,58.0 L522.0,58.0" keyPoints="0;0;1;1" keyTimes="0;0.23;0.3;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.23;0.234;0.3;0.304;1"/></circle><circle r="7" class="dg-packet" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M522.0,58.0 L672.0,58.0" keyPoints="0;0;1;1" keyTimes="0;0.33;0.4;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.33;0.334;0.4;0.404;1"/></circle><text x="380" y="175" class="dg-label" text-anchor="middle" opacity="0">① default gateway<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.03;0.034;0.13;0.134;1"/></text><text x="380" y="175" class="dg-label" text-anchor="middle" opacity="0">② NAT rewrites source IP<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.13;0.134;0.23;0.234;1"/></text><text x="380" y="175" class="dg-label" text-anchor="middle" opacity="0">③ handed to another AS<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.23;0.234;0.33;0.334;1"/></text><text x="380" y="175" class="dg-label" text-anchor="middle" opacity="0">④ nearest edge answers<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.33;0.334;0.43;0.434;1"/></text><circle r="7" class="dg-packet-2" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" path="M672.0,148.0 L72.0,148.0" keyPoints="0;0;1;1" keyTimes="0;0.5;0.78;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.504;0.78;0.784;1"/></circle><text x="380" y="175" class="dg-label" text-anchor="middle" opacity="0">⑤ response returns (NAT maps it back to the laptop)<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.504;0.86;0.864;1"/></text><text x="380" y="22" class="dg-sub" text-anchor="middle">request packets ▸   ◂ response packets</text></svg>
